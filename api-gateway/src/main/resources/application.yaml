server:
  port: 8080

# Örnek: GATEWAY_CORS_ORIGIN_PATTERNS=http://localhost:*,https://ornek.com
gateway:
  cors:
    allowed-origin-patterns: ${GATEWAY_CORS_ORIGIN_PATTERNS:*}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: player-service-route
          uri: ${PLAYER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/players,/api/players/**
          filters:
            - StripPrefix=1

        - id: scouting-service-route
          uri: ${SCOUTING_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/scouts,/api/scouts/**
          filters:
            - StripPrefix=1