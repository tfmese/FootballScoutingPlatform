
# Veritabanı + Redis: docker compose up -d
# API'ler (player-service, scouting-service, api-gateway): docker compose --profile app up -d --build

services:
  postgres-db:
    image: postgres:15
    container_name: scouting_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: player_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo-db:
    image: mongo:latest
    container_name: scouting_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval \"quit(db.adminCommand('ping').ok ? 0 : 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: scouting_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  player-service:
    profiles:
      - app
    build:
      context: .
      dockerfile: player-service/Dockerfile
    container_name: scouting_player_service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/player_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      REDIS_HOST: redis
      PLAYER_CACHE_REDIS_ENABLED: "true"
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  scouting-service:
    profiles:
      - app
    build:
      context: .
      dockerfile: scouting-service/Dockerfile
    container_name: scouting_scouting_service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_MONGODB_URI: mongodb://root:password@mongo-db:27017/scouting_db?authSource=admin
      PLAYER_SERVICE_URL: http://player-service:8081
    depends_on:
      mongo-db:
        condition: service_healthy

  api-gateway:
    profiles:
      - app
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: scouting_api_gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PLAYER_SERVICE_URL: http://player-service:8081
      SCOUTING_SERVICE_URL: http://scouting-service:8082
    depends_on:
      player-service:
        condition: service_started
      scouting-service:
        condition: service_started
