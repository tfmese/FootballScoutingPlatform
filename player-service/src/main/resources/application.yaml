server:
  port: 8081

spring:
  application:
    name: player-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/player_db}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Redis önbelleği: docker-compose ile redis ayağa kalkınca PLAYER_CACHE_REDIS_ENABLED=true verin.
player:
  cache:
    redis:
      enabled: ${PLAYER_CACHE_REDIS_ENABLED:false}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      ttl-seconds: ${PLAYER_LIST_CACHE_TTL_SECONDS:60}